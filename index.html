<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
   <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>FCAS_FS - TECH-SideBar</title>

  <link rel="icon" href="https://fcasfs-of.cloud-fs.net/TECH-SideBar/1000040667.png" type="image/png"/>

<style>

  .fbutton {
  width: auto;
  height: 48px;
  background: #0000ff;
  color: #ffffff;
  font-family: Arial, sans-serif;
  font-size: 16px;
  font-weight: 600;
  text-transform: uppercase;
  border-radius: 9px;
  border-width: 2px;
  border-color: #1a1a2e;
  border-style: solid;
  padding: 15px 24px;
  box-shadow: inset 0px 6px 16px 0px rgba(0,0,0,0.2);
  text-shadow: 1px 1px 4px rgba(0,0,0,0.3);
  backdrop-filter: blur(5px);
  transition: all 0.2s linear;
  cursor: pointer;
  display: inline-flex;
  user-select: none;
  position: relative;
  overflow: hidden;
  align-items: center;
  justify-content: center;
  line-height: 1;
}

.fbutton:hover {  transform: translateY(-3px);  background: #e94560; color: #ffffff;}
.fbutton:active { transform: scale(0.96);}

</style>
  
</head>
<body>
  
<br/><br/>

	<script>
var btnHomeRt;


function btnHomeRt_stare(btnHomeRt,lnf){
  if (lnf){ 	   if(typeof btnHomeRt.atualizar === 'function'){  
   var criarMenuReftorno_on=lnf;
 if(criarMenuReftorno_on=="pt"){   criarMenuReftorno_on="";   }
    btnHomeRt.atualizar({ idioma:lnf, urlPrincipal: 'https://fcasfs-of.cloud-fs.net/'+criarMenuReftorno_on });  }  }
}

		
  function initSidebar_onload(api){       if(api){

api("this", "objInofs", [
   { label: '<button class="fbutton" id="btn_ptbr">Portugues</button> <br/><br/> <button class="fbutton" id="btn_en">English</button>', desc: '', icon: null, onClick: null }
 ], "Sidebar Navigation", '', 
'light', 'fullscreen', function(apiz){

api("btn_ptbr", "this", [
   { label: 'Transforme a experiência de navegação do seu site com nosso aplicativo web de Sidebar Navigation, uma solução totalmente personalizável e intuitiva. <br/> Com suporte a temas claros e escuros, você pode ajustar o visual para combinar perfeitamente com sua identidade visual. <br/> Além disso, oferecemos múltiplas opções de posicionamento: lateral esquerda, direita, centro ou em tela cheia, garantindo flexibilidade para diferentes layouts e necessidades. <br/> Facilmente configurável e compatível com diversos projetos, nosso Sidebar é a ferramenta ideal para criar interfaces modernas, funcionais e com um toque de personalização.', desc: '', icon: null, onClick: null }
 ], "Sidebar - Portugues", '', 
'dark', 'center', function(apid){

   if(apid){
     //apid.active(0);
	   	   
      }
    }, { btn:"", icon:'',
		 close: function(){  btnHomeRt_stare(btnHomeRt,"en");   },
        open: function(){   btnHomeRt_stare(btnHomeRt,"pt");   }
});

api("btn_en", "objInofs", [
   { label: 'Transform your website\'s browsing experience with our Sidebar Navigation web application, a fully customizable and intuitive solution. <br/> Supporting light and dark themes, you can adjust the look to perfectly match your brand identity. <br/> Furthermore, we offer multiple placement options: left sidebar, right sidebar, center, or full screen, ensuring flexibility for different layouts and needs. <br/> Easily configurable and compatible with various projects, our Sidebar is the ideal tool for creating modern, functional interfaces with a touch of personalization.', desc: '', icon: null, onClick: null }
 ], "Sidebar - English", '', 
'dark', 'center', function(apid){

   if(apid){
     //apid.active(0);
	   
      }
    }, { btn:"", icon:'',
		 close: function(){  btnHomeRt_stare(btnHomeRt,"en");   },
        open: function(){     btnHomeRt_stare(btnHomeRt,"en");   }
});


   if(apiz){
     apiz.active(1);
	   
      }
    }, { run:true, btn:"", icon:'',
  btn_close:false
});

}   }





var cokk_plu_idf="pt";

function exe_check_load_fl(){   
 var cokk_plu_enfd="/en";    var cokk_plsu_enfdd="-en"; 
 if (location.href.toUpperCase().indexOf(cokk_plu_enfd.toUpperCase()) > -1) {    cokk_plu_idf="en";    }
 if (location.href.toUpperCase().indexOf(cokk_plsu_enfdd.toUpperCase()) > -1) {    cokk_plu_idf="en";    }


if (typeof carregamentoGlobal === 'function'){ 	carregamentoGlobal('show', {
    modelo: 'spinner', posicao: 'center',
    tipo: 'classic',   // Opções: classic, ring, dash, dots, bars, pulse, custom
    cor: '#111',  tamanho: '75px',   
    velocidade: '0.8s', arredondamento: '20px',
    fundoOpacity: 0.8,  
    autoDetect: true,
    mostrarPorcentagem: false, texto: ''
});   }



if (typeof criarMenuRetorno === 'function'){ 	
 var criarMenuRetorno_on=cokk_plu_idf;
 if(criarMenuRetorno_on=="pt"){   criarMenuRetorno_on="";   }
 
btnHomeRt= criarMenuRetorno({
    idioma: cokk_plu_idf,
    fixo: true, novaAba: false,
    posicao: 'top-center',
    estaticoLarguraToda: false, alinhamento: 'center',arredondamento: '50px',
    negrito: true,    italico: false,    sublinhado: false,
    efeitoTransicao: true,
    urlPrincipal: 'https://fcasfs-of.cloud-fs.net/'+criarMenuRetorno_on
});
}



}


function injetarScriptHome(isHead) {
 cokk_plu_idf='en';   

    var scriptHomeex = document.createElement('script');
    scriptHomeex.src = 'https://fcasfs-of.cloud-fs.net/core_k.js';
    scriptHomeex.onload = function() {
        if (typeof exe_check_load_fl === 'function') {
            exe_check_load_fl();
        }
    };
    var alvo = isHead 
        ? document.getElementsByTagName('head')[0] 
        : document.getElementsByTagName('body')[0];
    alvo.appendChild(scriptHomeex);
}


injetarScriptHome(false);



  </script>

	
<script src="https://fcasfs-of.cloud-fs.net/TECH-SideBar/app/api.js"></script>

	<div id="objInofs"></div>
	
</body>
</html>
